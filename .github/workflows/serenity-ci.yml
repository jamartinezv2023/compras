name: Serenity BDD CI

on:
  push:
    branches:
      - main
      - maxima-calificacion
      - excelencia-final
  pull_request:
    branches:
      - main

jobs:
  build-validation:
    name: Build, compile and SonarCloud validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew

      - name: Compile test project
        run: ./gradlew clean compileTestJava --info

      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  serenity-e2e:
    name: Serenity E2E report
    runs-on: ubuntu-latest
    needs: build-validation
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install XVFB
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew

      - name: Execute Serenity E2E tests
        run: xvfb-run -a ./gradlew clean test aggregate --info
        env:
          CI: true
          CHROME_BIN: google-chrome

      - name: Upload Gradle Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-report
          path: build/reports/tests/test

      - name: Upload Serenity Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report
          path: target/site/serenity

      - name: Upload Test Results XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xml
          path: build/test-results/test
